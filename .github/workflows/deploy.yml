name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to server via SFTP
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }} -p ${{ secrets.FTP_PORT || '22' }} sftp://${{ secrets.FTP_SERVER }}
          mirror --reverse --delete --verbose --exclude-glob .git* --exclude-glob node_modules* ./dist/ ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          quit
          "
