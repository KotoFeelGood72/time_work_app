name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to server via SFTP
        env:
          SFTP_USER: ${{ secrets.FTP_USER }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_PORT: ${{ secrets.FTP_PORT || '22' }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
        run: |
          lftp -u ${SFTP_USER},${SFTP_PASSWORD} -p ${SFTP_PORT} sftp://${SFTP_SERVER} <<EOF
          set sftp:auto-confirm yes
          mirror --reverse --delete --verbose --exclude-glob .git* --exclude-glob node_modules* ./dist/ ${SFTP_DIR}
          quit
          EOF
