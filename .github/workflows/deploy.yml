name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "dist/*"
          target: ${{ secrets.SERVER_PATH || '~/public_html' }}
          strip_components: 1
          rm: true

      - name: Set permissions on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            DEPLOY_PATH="${{ secrets.SERVER_PATH || '~/public_html' }}"
            # Расширяем ~ до полного пути если нужно
            if [[ "$DEPLOY_PATH" == ~* ]]; then
              DEPLOY_PATH="${DEPLOY_PATH/#\~/$HOME}"
            fi
            # Устанавливаем права (для хостинга обычно не нужен chown, только chmod)
            chmod -R 755 "$DEPLOY_PATH" || true
            # Перезагрузка веб-сервера (если доступно)
            systemctl reload apache2 || systemctl reload nginx || service apache2 reload || service nginx reload || true
