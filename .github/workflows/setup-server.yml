name: Setup Server (One-time)

on:
  workflow_dispatch:

jobs:
  setup:
    name: Setup Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Apache and PHP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            apt-get update -y
            apt-get install -y apache2 php php-cli php-common libapache2-mod-php
            a2enmod rewrite
            a2enmod headers
            chown -R www-data:www-data ${{ secrets.SERVER_PATH || '/var/www/html' }}
            chmod -R 755 ${{ secrets.SERVER_PATH || '/var/www/html' }}
            systemctl restart apache2
            systemctl enable apache2
            echo "✅ Сервер настроен!"
