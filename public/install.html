<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Установка приложения</title>
  <script src="https://api.bitrix24.com/api/v1/"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      margin-top: 0;
      color: #667eea;
    }
    .status {
      margin: 1rem 0;
      padding: 1rem;
      border-radius: 5px;
    }
    .loading {
      background: #f0f0f0;
      color: #666;
    }
    .success {
      background: #d4edda;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Установка приложения</h1>
    <div id="status" class="status loading">
      <div class="spinner"></div>
      <p>Инициализация...</p>
    </div>
  </div>

  <script>
    (function() {
      const statusEl = document.getElementById('status');
      
      function updateStatus(message, type) {
        statusEl.className = 'status ' + type;
        statusEl.innerHTML = '<p>' + message + '</p>';
      }

      function install() {
        if (typeof window !== 'undefined' && window.BX24) {
          window.BX24.init(function() {
            updateStatus('Проверка статуса установки...', 'loading');
            
            window.BX24.callMethod(
              'app.info',
              {},
              function(result) {
                if (result.answer && result.answer.result) {
                  if (result.answer.result.INSTALLED === false) {
                    updateStatus('Завершение установки...', 'loading');
                    window.BX24.installFinish();
                    updateStatus('Приложение успешно установлено!', 'success');
                  } else {
                    updateStatus('Приложение уже установлено.', 'success');
                  }
                } else {
                  updateStatus('Ошибка при получении информации о приложении', 'error');
                }
              }
            );
          });
        } else {
          updateStatus('Ошибка: Библиотека Bitrix24 не загружена', 'error');
        }
      }

      // Ждем загрузки скрипта Bitrix24
      if (window.BX24) {
        install();
      } else {
        window.addEventListener('load', function() {
          setTimeout(function() {
            if (window.BX24) {
              install();
            } else {
              updateStatus('Ошибка: Не удалось загрузить библиотеку Bitrix24', 'error');
            }
          }, 1000);
        });
      }
    })();
  </script>
</body>
</html>
