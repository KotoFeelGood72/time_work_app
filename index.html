<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://api.bitrix24.com/api/v1/"></script>
    <title>Vite App</title>
    <script>
      // Инициализация мока BX24 для локальной разработки
      // Выполняется сразу после загрузки страницы, до инициализации Vue
      (function() {
        function initMock() {
          // Проверяем, доступен ли реальный BX24
          if (typeof window !== 'undefined' && !window.BX24) {
            // Создаем базовый мок для предотвращения ошибок до загрузки полного мока
            window.BX24 = {
              _isFullMock: false,
              init: function(callback) {
                console.log('[MOCK] BX24.init вызван (базовый мок)');
                setTimeout(callback, 50);
              },
              callMethod: function(method, params, callback) {
                console.log('[MOCK] BX24.callMethod вызван (базовый мок):', method);
                // Возвращаем пустой результат, чтобы не было ошибок
                setTimeout(function() {
                  callback({
                    answer: {
                      result: []
                    }
                  });
                }, 100);
              },
              installFinish: function() {
                console.log('[MOCK] BX24.installFinish вызван');
              }
            };
            console.log('[MOCK] Базовый мок BX24 установлен');
          }
        }

        // Пытаемся инициализировать сразу
        initMock();
        
        // Также пытаемся после загрузки DOM (на случай, если скрипт Bitrix24 загружается асинхронно)
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initMock, 200);
          });
        } else {
          setTimeout(initMock, 200);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
